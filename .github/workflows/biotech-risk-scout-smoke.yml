name: Biotech Risk Scout Smoke

on:
  push:
    paths:
      - "biotech-risk-scout/**"
      - ".github/workflows/biotech-risk-scout-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile
        run: python -m compileall -q biotech-risk-scout

      - name: Unit tests
        run: python -m pytest -q biotech-risk-scout/tests

  scheduled-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SEC user-agent secret
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Configure the SEC_USER_AGENT repository secret before running scheduled scans."
            exit 1
          fi

      - name: Restore previous scan snapshot and validation cache
        uses: actions/cache/restore@v4
        with:
          path: |
            biotech-risk-scout/snapshots
            biotech-risk-scout/.cache
          key: biotech-risk-scout-snapshots-${{ github.run_id }}
          restore-keys: |
            biotech-risk-scout-snapshots-

      - name: Run daily scan
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python biotech-risk-scout/scripts/run_daily_scan.py \
            --no-table \
            --max-workers 4 \
            --output-dir biotech-risk-scout/snapshots \
            --validate-sec-text \
            --max-sec-documents 2 \
            --sec-validation-cache biotech-risk-scout/.cache/sec-validation.json

      - name: Save latest scan snapshot and validation cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            biotech-risk-scout/snapshots
            biotech-risk-scout/.cache
          key: biotech-risk-scout-snapshots-${{ github.run_id }}

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biotech-risk-scout-snapshots
          path: biotech-risk-scout/snapshots
