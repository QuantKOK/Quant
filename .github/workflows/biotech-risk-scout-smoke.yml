name: Biotech Risk Scout Smoke

on:
  push:
    paths:
      - "biotech-risk-scout/**"
      - ".github/workflows/biotech-risk-scout-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: BiotechRiskScout smoke-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Biotech Risk Scout
        run: python -m compileall -q biotech-risk-scout

      - name: Run SEC smoke test for MRNA
        run: python biotech-risk-scout/app/main.py MRNA

      - name: Run SEC smoke test for VKTX
        run: python biotech-risk-scout/app/main.py VKTX

      - name: Run SEC smoke test for SAVA
        run: python biotech-risk-scout/app/main.py SAVA
