name: Biotech Risk Scout Smoke

on:
  push:
    paths:
      - "biotech-risk-scout/**"
      - ".github/workflows/biotech-risk-scout-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile
        run: python -m compileall -q biotech-risk-scout

      - name: Unit tests
        run: python -m pytest -q biotech-risk-scout/tests
